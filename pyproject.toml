[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "touchpoint-lab"
version = "0.0.1"
description = "Event-taxonomy take-home demo"
authors = [{ name = "Caitlin" }]
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "hdbscan",
    "lightgbm",
    "shap"
]

[tool.setuptools]
package-dir = {"" = "src"}
